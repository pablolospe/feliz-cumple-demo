<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brillo dorado -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3c7" />
      <stop offset="50%" stop-color="#e8c97a" />
      <stop offset="100%" stop-color="#c9a84c" />
    </linearGradient>
    <!-- Llama cálida -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <!-- Glaseado pastel suave -->
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="50%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <!-- Masa de bizcochuelo -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2d54" />
      <stop offset="100%" stop-color="#1f1830" />
    </linearGradient>
    <!-- Plato / base -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#c9a84c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Llama de la vela con resplandor -->
  <path d="M32 4 C34 9, 36 13, 32 18 C28 13, 30 9, 32 4 Z" fill="url(#flameGrad)" filter="url(#glow)" />
  <circle cx="32" cy="13" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Mecha -->
  <line x1="32" y1="18" x2="32" y2="22" stroke="#241d36" stroke-width="1.8" stroke-linecap="round" />

  <!-- Velita -->
  <rect x="29.5" y="21" width="5" height="13" rx="1.5" fill="url(#goldGrad)" />
  <path d="M29.5 24 L34.5 27 M29.5 28 L34.5 31" stroke="#b45309" stroke-width="0.8" opacity="0.6" />

  <!-- Plato base -->
  <ellipse cx="32" cy="56" rx="26" ry="4.5" fill="url(#plateGrad)" opacity="0.9" />

  <!-- Cuerpo de la torta (Piso inferior) -->
  <rect x="12" y="38" width="40" height="15" rx="3" fill="url(#cakeGrad)" stroke="#c9a84c" stroke-width="1" />

  <!-- Relleno crema entre capas -->
  <rect x="13" y="44" width="38" height="2" rx="1" fill="url(#frostingGrad)" opacity="0.7" />

  <!-- Glaseado superior con ondas cayendo -->
  <path d="M11 38 C11 34, 53 34, 53 38 C53 41, 50 43, 47 41 C44 39, 42 43, 39 41 C36 39, 34 43, 31 41 C28 39, 26 43, 23 41 C20 39, 18 43, 15 41 C12 39, 11 41, 11 38 Z" fill="url(#frostingGrad)" />

  <!-- Detalles de decoración dorada en la torta -->
  <circle cx="16" cy="36.5" r="1.5" fill="#fef08a" />
  <circle cx="24" cy="36" r="1.5" fill="#fef08a" />
  <circle cx="32" cy="36" r="1.8" fill="#fef08a" />
  <circle cx="40" cy="36" r="1.5" fill="#fef08a" />
  <circle cx="48" cy="36.5" r="1.5" fill="#fef08a" />
</svg>
